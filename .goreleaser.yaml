version: 2

project_name: tf-sim

before:
  hooks:
    - go mod verify

builds:
  - id: tf-sim
    main: ./cmd/tf-sim
    binary: tf-sim
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: tf-sim
    ids:
      - tf-sim
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: justr00t
    name: tf-sim
  prerelease: auto

homebrew_casks:
  - name: tf-sim
    binaries:
      - tf-sim
    repository:
      owner: justr00t
      name: homebrew-tap
      branch: main
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    directory: Casks
    homepage: "https://github.com/justr00t/tf-sim"
    description: "Cloud-agnostic Terraform & OpenTofu policy verification, blast-radius simulation, and surgical HCL remediation engine"
    license: "Apache-2.0"
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/tf-sim"]
          end
